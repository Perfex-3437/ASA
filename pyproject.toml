[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmtrace"
version = "0.1.0"
description = "Local-first tracing and anomaly detection for multi-agent Python programs"
requires-python = ">=3.9"

[project.scripts]
swarmtrace = "swarmtrace.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
